[project]
name = "agent-verification-demo"
version = "0.1.0"
description = "Reproducible demo of trace-derived and journey-aware agent verification"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-adk>=1.31.1,<2.0.0",
    "litellm>=1.80.8,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "truststore>=0.10.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.11.11,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model", "src/workshop_verify_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
