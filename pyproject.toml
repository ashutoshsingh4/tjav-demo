[project]
name = "tjav"
version = "0.1.0"
description = "Trajectory and Journey-Aware Verifier"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[project.optional-dependencies]
adk = [
    "google-adk>=2.0.0,<3.0.0",
    "openai>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop_verify_agents"]

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.11.11,<1.0.0",
    "google-adk>=2.0.0,<3.0.0",
    "openai>=2.0.0,<3.0.0",
]
